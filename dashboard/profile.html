<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Healthy Bharat Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../dist/output.css" rel="stylesheet">
</head>
<body class="font-body text-gray-800 bg-gray-50/50 antialiased min-h-screen flex flex-col">

    <hbm-header base-path="../"></hbm-header>

    <div class="flex-grow py-8 px-4 lg:px-8 max-w-[1500px] mx-auto w-full">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar -->
            <hbm-dashboard-sidebar active-page="profile"></hbm-dashboard-sidebar>

            <!-- Main Content -->
            <div id="dashboard-main" class="flex-1 bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 p-6 lg:p-8 transition-opacity duration-300">
                <div class="flex justify-between items-end border-b border-gray-100 pb-5 mb-6">
                    <div>
                        <h2 class="text-2xl font-heading font-bold text-gray-800">My Profile</h2>
                        <p class="text-gray-500 mt-1">Manage your personal information.</p>
                    </div>
                </div>

                <form class="max-w-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                        <div>
                            <label class="block text-[13px] font-semibold text-[#052b14] mb-2">First Name</label>
                            <div class="flex items-center rounded-xl border border-gray-200 bg-gray-50 h-[50px] px-4">
                                <input type="text" id="prof-fname" disabled class="w-full bg-transparent outline-none text-[14px] text-gray-700 font-medium">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] font-semibold text-[#052b14] mb-2">Last Name</label>
                            <div class="flex items-center rounded-xl border border-gray-200 bg-gray-50 h-[50px] px-4">
                                <input type="text" id="prof-lname" disabled class="w-full bg-transparent outline-none text-[14px] text-gray-700 font-medium">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] font-semibold text-[#052b14] mb-2">Email Address</label>
                            <div class="flex items-center rounded-xl border border-gray-200 bg-gray-50 h-[50px] px-4">
                                <input type="email" id="prof-email" disabled class="w-full bg-transparent outline-none text-[14px] text-gray-700 font-medium">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[13px] font-semibold text-[#052b14] mb-2">Phone Number</label>
                            <div class="flex items-center rounded-xl border border-gray-200 bg-gray-50 h-[50px] px-4">
                                <input type="tel" id="prof-phone" disabled class="w-full bg-transparent outline-none text-[14px] text-gray-700 font-medium">
                            </div>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        document.addEventListener('hbm:auth-ready', () => {
            if (window.HBM_USER) {
                document.getElementById('prof-fname').value = window.HBM_USER.first_name || '';
                document.getElementById('prof-lname').value = window.HBM_USER.last_name || '';
                document.getElementById('prof-email').value = window.HBM_USER.email || '';
                document.getElementById('prof-phone').value = window.HBM_USER.phone || '';
            }
        });
    </script>
</body>
</html>
