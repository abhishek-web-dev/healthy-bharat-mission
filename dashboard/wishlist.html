<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Healthy Bharat Mission</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../dist/output.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/images/favicon/site.webmanifest" />
</head>
<body class="font-body text-gray-800 bg-gray-50/50 antialiased min-h-screen flex flex-col">

    <hbm-header base-path="../"></hbm-header>

    <div class="flex-grow py-8 px-4 lg:px-8 max-w-[1500px] mx-auto w-full">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar -->
            <hbm-dashboard-sidebar active-page="wishlist"></hbm-dashboard-sidebar>

            <!-- Main Content -->
            <div id="dashboard-main" class="flex-1 bg-white rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 p-6 lg:p-8 transition-opacity duration-300">
                <div class="flex justify-between items-end border-b border-gray-100 pb-5 mb-6">
                    <div>
                        <h2 class="text-2xl font-heading font-bold text-gray-800">Wishlist</h2>
                        <p class="text-gray-500 mt-1">Items you have saved for later.</p>
                    </div>
                </div>

                <div id="wishlist-items-container" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Wishlist items will be injected here -->
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/content.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
